name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (tag in the comment),
# resolved with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` and, for
# annotated tags, dereferenced with `gh api repos/<owner>/<repo>/git/tags/<sha>`.
env:
  PNPM_VERSION: "12.21.0"
  NODE_VERSION: "26"
  HELM_VERSION: "v3.19.0"

jobs:
  go:
    name: Go (lint, test -race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Installed once from the release tarball, checked against a pinned
      # sha256 and the release's checksums file. `make lint` (gofmt, go vet,
      # golangci-lint) is then the same command developers run.
      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: "2.15.0"
          GOLANGCI_LINT_SHA256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
        run: |
          set -euo pipefail
          v=$GOLANGCI_LINT_VERSION
          f=golangci-lint-$v-linux-amd64.tar.gz
          base=https://github.com/golangci/golangci-lint/releases/download/v$v
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$f"
          curl -sSfLO "$base/golangci-lint-$v-checksums.txt"
          echo "$GOLANGCI_LINT_SHA256  $f" | sha256sum -c -
          grep "  $f\$" "golangci-lint-$v-checksums.txt" | sha256sum -c -
          tar -xzf "$f"
          mkdir -p "$RUNNER_TEMP/bin"
          mv "golangci-lint-$v-linux-amd64/golangci-lint" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/golangci-lint" --version
      - run: make lint
      - run: go test -race -count=1 ./...
      - run: make build build-plugin

  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: VERSION=${{ github.sha }}
          tags: chronos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
          checksum-policy: required
      - run: make helm-lint HELM=helm
      - name: Render non-default values
        run: >-
          helm template demo deploy/helm/chronos --namespace tools
          --set persistence.enabled=false --set config.storage=memory
          --set networkPolicy.enabled=true
          --set 'config.resources={pods,deploy}' >/dev/null

  integration:
    name: Integration on kind
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
          checksum-policy: required
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: chronos-ci
      - name: Write kubeconfig
        run: kind get kubeconfig --name chronos-ci > "$RUNNER_TEMP/chronos-ci.kubeconfig"
      - name: Collector integration tests
        env:
          CHRONOS_KUBECONFIG: ${{ runner.temp }}/chronos-ci.kubeconfig
          CHRONOS_KUBE_CONTEXT: kind-chronos-ci
        run: go test -race -count=1 -tags integration ./internal/collector/ -run Integration -v
      - name: Install the chart and run the demo scenario
        run: ./hack/kind-demo.sh
        env:
          CLUSTER: chronos-ci
          KUBECONFIG_FILE: ${{ runner.temp }}/chronos-ci.kubeconfig
          HELM: helm
      - name: Diagnostics on failure
        if: failure()
        run: |
          K="kubectl --kubeconfig $RUNNER_TEMP/chronos-ci.kubeconfig --context kind-chronos-ci"
          $K get pods -A -o wide || true
          $K -n chronos describe pod chronos-0 || true
          $K -n chronos logs chronos-0 --all-containers || true
