name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "12.21.0"
  NODE_VERSION: "26"
  GOLANGCI_LINT_VERSION: "v2.15.0"
  HELM_VERSION: "v3.19.0"

jobs:
  go:
    name: Go (lint, test -race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The action gives inline PR annotations. `make lint` (gofmt, go vet,
      # golangci-lint) is the same command developers run; it needs the
      # binary on PATH, which the action does not guarantee, so the same
      # pinned version is installed explicitly.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: make lint
        run: |
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
          make lint
      - run: go test -race -count=1 ./...
      - run: make build build-plugin

  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=${{ github.sha }}
          tags: chronos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - run: make helm-lint HELM=helm
      - name: Render non-default values
        run: >-
          helm template demo deploy/helm/chronos --namespace tools
          --set persistence.enabled=false --set config.storage=memory
          --set networkPolicy.enabled=true
          --set 'config.resources={pods,deploy}' >/dev/null

  integration:
    name: Integration on kind
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: helm/kind-action@v1
        with:
          cluster_name: chronos-ci
      - name: Write kubeconfig
        run: kind get kubeconfig --name chronos-ci > "$RUNNER_TEMP/chronos-ci.kubeconfig"
      - name: Collector integration tests
        env:
          CHRONOS_KUBECONFIG: ${{ runner.temp }}/chronos-ci.kubeconfig
          CHRONOS_KUBE_CONTEXT: kind-chronos-ci
        run: go test -race -count=1 -tags integration ./internal/collector/ -run Integration -v
      - name: Install the chart and run the demo scenario
        run: ./hack/kind-demo.sh
        env:
          CLUSTER: chronos-ci
          KUBECONFIG_FILE: ${{ runner.temp }}/chronos-ci.kubeconfig
          HELM: helm
      - name: Diagnostics on failure
        if: failure()
        run: |
          K="kubectl --kubeconfig $RUNNER_TEMP/chronos-ci.kubeconfig --context kind-chronos-ci"
          $K get pods -A -o wide || true
          $K -n chronos describe pod chronos-0 || true
          $K -n chronos logs chronos-0 --all-containers || true
