name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/krishhna24/chronos
  HELM_VERSION: "v3.19.0"

jobs:
  image:
    name: Image (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # No QEMU: every RUN step executes on the build platform (the Go stage
      # cross-compiles) and the final stage only copies files.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # The chart's default image tag is its appVersion, which the chart
          # job sets to the version without the leading "v".
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  plugin:
    name: kubectl-at binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: ./hack/build-plugin-release.sh "$GITHUB_REF_NAME" dist
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/
          if-no-files-found: warn

  chart:
    name: Helm chart package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - run: |
          v=${GITHUB_REF_NAME#v}
          helm lint --strict deploy/helm/chronos
          helm package deploy/helm/chronos --version "$v" --app-version "$v" -d dist
          (cd dist && sha256sum chronos-*.tgz > "chronos-chart_${GITHUB_REF_NAME}_checksums.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [image, plugin, chart]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
