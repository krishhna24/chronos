{{- if .Values.rbac.create }}
{{- $core := list }}
{{- $apps := list }}
{{- range (include "chronos.selectedTypes" . | fromJson).types }}
{{- if eq .group "" }}{{ $core = append $core .resource }}{{ else }}{{ $apps = append $apps .resource }}{{ end }}
{{- end }}
# Rules are generated from config.resources: only the recorded types are
# granted. Reflectors only LIST and WATCH; nothing GETs single objects.
# Secrets are read through the metadata API, but Kubernetes RBAC cannot
# restrict a grant to metadata: list/watch on secrets also allows reading
# Secret data with this ServiceAccount's token (ADR 0005).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chronos.clusterName" . }}
  labels:
    {{- include "chronos.labels" . | nindent 4 }}
rules:
  {{- with $core }}
  - apiGroups: [""]
    resources: {{ toJson . }}
    verbs: ["list", "watch"]
  {{- end }}
  {{- with $apps }}
  - apiGroups: ["apps"]
    resources: {{ toJson . }}
    verbs: ["list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chronos.clusterName" . }}
  labels:
    {{- include "chronos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chronos.clusterName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "chronos.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
