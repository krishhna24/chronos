apiVersion: v1
kind: Service
metadata:
  name: {{ include "chronos.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chronos.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "chronos.selectorLabels" . | nindent 4 }}
  ports:
    # kubectl-at addresses this port by name: services/<svc>:http/proxy.
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
# Governing Service for the StatefulSet (stable pod DNS); not used by
# clients.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chronos.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chronos.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "chronos.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
